<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>[로그인] 화면</title>
</head>
<body>

<h1>[로그인] 화면</h1>

<nav>
  <a href="/testpages/index.html">홈</a> |
  <a href="/testpages/signup.html">회원가입</a> |
  <a href="/testpages/login.html">로그인</a> |
  <a href="/testpages/drinks.html">내 음료</a> |
  <a href="/testpages/presets.html">프리셋</a> |
  <button onclick="doLogout()">로그아웃</button>
  &nbsp;&nbsp;[<span id="auth-status">확인중...</span>]
</nav>
<hr>

<h2>POST /auth/login/</h2>
<form id="login-form">
  <label>username <input type="text" name="username" required></label><br><br>
  <label>password <input type="password" name="password" required></label><br><br>
  <button type="submit">로그인</button>
</form>

<h3>응답</h3>
<pre id="login-result">(아직 요청 없음)</pre>

<script src="common.js"></script>
<script>
initNav();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const result = await apiFetch("/auth/login/", "POST", {
    username: fd.get("username"),
    password: fd.get("password"),
  });
  renderResult("login-result", result);
  initNav();
});
</script>

</body>
</html>
