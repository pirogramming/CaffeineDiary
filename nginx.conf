# CaffeineDiary — nginx 리버스 프록시 설정
# docker-compose 에서 /etc/nginx/conf.d/default.conf 로 마운트된다.

upstream django {
    server web:8000;   # docker-compose 의 web 서비스 (gunicorn)
}

server {
    listen 80;
    server_name _;     # 도메인 붙이면 여기에 도메인 기입

    # 이미지 업로드(pillow) 대비 업로드 용량 제한 완화
    client_max_body_size 20M;

    # 정적 파일: collectstatic 결과(STATIC_ROOT=/app/staticfiles)를 nginx가 직접 서빙
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # 사용자 업로드(media)를 쓰게 되면 아래 주석 해제 + settings 에 MEDIA_ROOT/MEDIA_URL 설정 필요
    # location /media/ {
    #     alias /app/media/;
    #     access_log off;
    #     expires 30d;
    # }

    # 그 외 모든 요청은 gunicorn(Django)으로 프록시
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # settings 의 USE_X_FORWARDED_PROTO 와 연동
        proxy_redirect off;
    }
}
