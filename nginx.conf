upstream django {
    server web:8000;
}

# HTTP → HTTPS 리다이렉트 (인증 갱신 경로는 예외)
server {
    listen 80;
    server_name caffienediary.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name caffienediary.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/caffienediary.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caffienediary.duckdns.org/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
