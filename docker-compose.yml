# CaffeineDiary — 로컬/운영 공용 오케스트레이션
#   web (Django+gunicorn) + db (MySQL 8) + nginx
#
# 실행: docker compose up --build
# 사전조건: .env 에 MySQL 관련 값이 채워져 있어야 함 (아래 주석 참고)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # .env 의 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD 로 초기화된다.
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 호스트에서 DB에 직접 붙어볼 때만 주석 해제
    # ports:
    #   - "3306:3306"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너 네트워크에선 DB 호스트가 서비스명 'db', 드라이버는 MySQL로 고정한다.
      # (.env 의 DB_ENGINE/DB_HOST 값보다 우선 적용됨 → 로컬 runserver는 여전히 SQLite)
      DB_ENGINE: django.db.backends.mysql
      DB_HOST: db
      DB_PORT: "3306"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      # nginx 가 정적 파일을 서빙할 수 있도록 공유 볼륨에 collectstatic 결과를 담는다.
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  mysql_data:
  static_volume:
