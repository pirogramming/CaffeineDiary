<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Caffeine Diary{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/base.css' %}">

{% block extra_css %}{% endblock %}
</head>
<body>
<div class="cd-app">
    {% block header %}
    <header class="cd-header">
        <div class="cd-logo-card">
        <img src="{% static 'images/logo_background.png' %}" alt="" class="cd-logo-card__bg">
        <a href="{% url 'diary:feed' %}" class="cd-logo-card__link" aria-label="Caffeine Diary 메인으로">
            caffeine<br>diary
        </a>
        </div>
        <nav class="cd-nav" aria-label="주 메뉴" id="cd-nav">
        <a href="{% url 'diary:feed' %}" class="cd-nav__link">메인 화면</a>
        <a href="{% url 'diary:mydiary' %}" class="cd-nav__link">나의 다이어리</a>
        <a href="{% url 'diary:favorites' %}" class="cd-nav__link">음료 추가</a>
        <a href="{% url 'diary:allnight-setup' %}" class="cd-nav__link">밤샘 모드</a>
        <button type="button" class="cd-nav__link" id="cd-logout-btn">로그아웃</button>
        <a href="{% url 'diary:mypage' %}" class="cd-nav__link">마이페이지</a>
        </nav>

        <!-- 480px 미만에서만 보이는 햄버거 버튼. 평소엔 CSS로 숨겨져 있다. -->
        <button type="button" class="cd-nav-toggle" id="cd-nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="cd-nav">
          <span></span><span></span><span></span>
        </button>
    </header>
    {% endblock %}

    <!-- 드로어 열렸을 때 뒤를 덮는 반투명 배경. 클릭하면 드로어가 닫힌다. -->
    <div class="cd-nav-backdrop" id="cd-nav-backdrop" hidden></div>

    <main class="cd-main">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
    /* 음료 종류(DrinkType) -> 대표 아이콘 1개. Drink.icon_key가 비어있을 때(기본값) 쓴다. */
    window.CD_DRINK_ICONS = {
        coffee: "{% static 'images/icons/coffee_icon1.svg' %}",
        tea: "{% static 'images/icons/tea_icon.svg' %}",
        energy: "{% static 'images/icons/energydrink_icon1.svg' %}",
        soda: "{% static 'images/icons/cola_icon1.svg' %}",
        other: "{% static 'images/icons/coffee_icon1.svg' %}"
    };

    /* 음료 종류별로 사용자가 고를 수 있는 아이콘 전체 목록(음료 추가 화면의 "아이콘을 선택하세요" 단계용).
       key는 diary.constants.DRINK_ICON_KEYS와 반드시 일치해야 한다(서버가 그 값으로 검증한다). */
    window.CD_DRINK_ICON_OPTIONS = {
        coffee: [
            { key: "coffee_icon1", src: "{% static 'images/icons/coffee_icon1.svg' %}" },
            { key: "coffee_icon2", src: "{% static 'images/icons/coffee_icon2.svg' %}" },
            { key: "coffee_icon3", src: "{% static 'images/icons/coffee_icon3.svg' %}" },
            { key: "coffee_icon4", src: "{% static 'images/icons/coffee_icon4.svg' %}" },
            { key: "coffee_icon5", src: "{% static 'images/icons/coffee_icon5.svg' %}" },
            { key: "coffee_icon6", src: "{% static 'images/icons/coffee_icon6.svg' %}" }
        ],
        tea: [
            { key: "tea_icon", src: "{% static 'images/icons/tea_icon.svg' %}" }
        ],
        energy: [
            { key: "energydrink_icon1", src: "{% static 'images/icons/energydrink_icon1.svg' %}" },
            { key: "energydrink_icon2", src: "{% static 'images/icons/energydrink_icon2.svg' %}" },
            { key: "energydrink_icon3", src: "{% static 'images/icons/energydrink_icon3.svg' %}" },
            { key: "energydrink_icon4", src: "{% static 'images/icons/energydrink_icon4.svg' %}" },
            { key: "energydrink_icon5", src: "{% static 'images/icons/energydrink_icon5.svg' %}" },
            { key: "energydrink_icon6", src: "{% static 'images/icons/energydrink_icon6.svg' %}" },
            { key: "energydrink_icon7", src: "{% static 'images/icons/energydrink_icon7.svg' %}" }
        ],
        soda: [
            { key: "cola_icon1", src: "{% static 'images/icons/cola_icon1.svg' %}" },
            { key: "cola_icon2", src: "{% static 'images/icons/cola_icon2.svg' %}" }
        ]
    };
    // "기타"는 전용 아이콘이 없어 커피 아이콘 세트를 재사용한다(constants.DRINK_ICON_KEYS와 동일한 정책).
    window.CD_DRINK_ICON_OPTIONS.other = window.CD_DRINK_ICON_OPTIONS.coffee;
</script>
<script src="{% static 'js/base.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
