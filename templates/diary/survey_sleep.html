{% extends "diary/survey_base.html" %}
{% load static %}

{% block title %}회원가입 - 수면 시간, 몸무게 · Caffeine Diary{% endblock %}

{% block survey_card %}
<div class="cd-survey-final-wrap">

  <a href="{% url 'diary:survey-size' %}" class="cd-survey-final__arrow cd-survey-final__arrow--prev" aria-label="이전 단계">
    <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" fill="none" class="cd-arrow-icon">
      <g clip-path="url(#clip0_204_1410)">

      </g>
      <defs>
        <clipPath id="clip0_204_1410">
          <rect width="72" height="72" fill="white" transform="matrix(-1 0 0 1 72 0)"/>
        </clipPath>
      </defs>
    </svg>
  </a>

  <div class="cd-survey-final">
    <div class="cd-survey-final__content">
      <div class="cd-survey-final__bubble cd-survey-final__bubble--top">
        <img src="{% static 'images/sleepwhen.png' %}" alt="" class="cd-survey-final__bubble-img">
      </div>

      <div class="cd-survey-final__field cd-survey-final__field--time">
        <label for="cd-survey-bedtime">시간:</label>
        <input type="time" id="cd-survey-bedtime" class="cd-survey-final__input" placeholder="여기에 입력해주세요.">
      </div>

      <div class="cd-survey-final__bubble cd-survey-final__bubble--bottom">
        <img src="{% static 'images/aboutweight.png' %}" alt="" class="cd-survey-final__bubble-img">
      </div>

      <div class="cd-survey-final__field cd-survey-final__field--weight">
        <label for="cd-survey-weight">몸무게:</label>
        <input type="number" id="cd-survey-weight" class="cd-survey-final__input" placeholder="여기에 입력해주세요">
      </div>
    </div>
  </div>

  <!-- 화살표(prev/content) 아래에 별도로 배치된 제출 버튼.
       실제로는 세션에 쌓인 category/brand/menu/size + 이 화면의 수면시간/몸무게를
       API로 제출해야 하지만, 지금은 구조만 잡아두고 /feed/로 바로 이동한다. -->
  <div class="cd-survey-final__submit-wrap">
    <button type="button" class="cd-survey-submit-btn cd-btn--primary" id="cd-survey-submit">submit</button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('cd-survey-submit')?.addEventListener('click', () => {
    // TODO: 실제 연결 시 세션의 설문 응답 + 아래 입력값을 API로 제출 후 이동
    window.location.href = '/feed/';
  });
</script>
{% endblock %}
