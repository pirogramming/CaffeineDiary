{% extends "base.html" %}
{% load static %}

{% block title %}나의 다이어리 · Caffeine Diary{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/feed.css' %}">
{% endblock %}

{% block content %}
<section class="cd-feed-hero">

  <div class="cd-feed-main-wrapper">
    <!-- 오늘의 카페인 마감시간 -->
    <div class="cd-feed-hero__status">
      <!-- /feed-status/의 warnings(마감시간 초과, CALC-006 한계효용 등)를 여기 띄운다. feed.js가 채운다 -->
      <p class="cd-feed-hero__warning" id="cd-feed-warning" hidden></p>
      <p class="cd-feed-hero__label" id="cd-feed-label">오늘의 카페인 마감 시간은<br></p>
      <p class="cd-feed-hero__time"><span class="cd-numeric" id="cd-feed-cutoff-time">-</span></p>
    </div>

    <!-- 한잔 마시기 -->
    <div class="cd-feed-cup-wrap">
      <button type="button" class="cd-feed-cup cd-feed-cup--lg cd-feed-cup--{{ drink_type|default:'coffee' }}" id="cd-feed-drink-btn" aria-label="한잔 마시기 — 카페인 로그 남기기">
        <svg id="cd-feed-drink-default-icon" xmlns="http://www.w3.org/2000/svg" width="245" height="170" viewBox="0 0 245 170" fill="none">

          <path d="M98.6423 34.3063C70.7095 33.9011 17.0462 30.7527 17.0463 22.5818C17.0463 14.411 68.0884 11.888 98.6423 12.2787C129.196 12.6695 176.488 16.2072 175.925 24.0033C175.565 28.977 126.575 34.7115 98.6423 34.3063Z" fill="#8FB1AD"/>
          <path d="M92.162 35.1152C46.1487 35.1152 20.979 26.4384 20.979 26.4384C20.979 26.4384 46.1487 21.7056 89.409 21.7056C132.669 21.7055 167.278 28.016 167.278 28.016C167.278 28.016 138.175 35.1152 92.162 35.1152Z" fill="#543131"/>

        </svg>
        <img src="" alt="" class="cd-feed-cup__selected-icon" id="cd-feed-drink-selected-icon" style="display: none;">
        <span class="cd-feed-cup__label">한잔 마시기</span>
      </button>
      <p class="cd-feed-cup__selected-name" id="cd-feed-drink-selected-name" hidden></p>
    </div>

    <!-- 즐겨찾는 음료 - feed.js가 GET /users/me/drinks/의 즐겨찾기 최대 3개로 아이콘/라벨을 채운다 -->
    <ul class="cd-feed-cup-row" id="cd-feed-fav-row" aria-label="즐겨찾는 음료">
      <li class="cd-feed-fav-slot" data-slot="0" hidden>
        <button type="button" class="cd-feed-cup cd-feed-cup--sm" aria-label="즐겨찾는 음료">
          <img src="" alt="" class="cd-feed-cup__icon">
          <span class="cd-feed-cup__name"></span>
        </button>
      </li>
      <li class="cd-feed-fav-slot" data-slot="1" hidden>
        <button type="button" class="cd-feed-cup cd-feed-cup--sm" aria-label="즐겨찾는 음료">
          <img src="" alt="" class="cd-feed-cup__icon">
          <span class="cd-feed-cup__name"></span>
        </button>
      </li>
      <li class="cd-feed-fav-slot" data-slot="2" hidden>
        <button type="button" class="cd-feed-cup cd-feed-cup--sm" aria-label="즐겨찾는 음료">
          <img src="" alt="" class="cd-feed-cup__icon">
          <span class="cd-feed-cup__name"></span>
        </button>
      </li>
    </ul>
  </div>

  <button type="button" class="cd-feed-bubble" id="cd-feed-custom-drink-btn" aria-label="커스텀 마시기">
    <img src="{% static 'images/custom_drinking_button.png' %}" alt="" class="cd-feed-bubble__img">
  </button>

</section>

<!-- 커스텀 마시기 — 즐겨찾기에 없는 음료를 이름+카페인량 직접 입력으로 기록 -->
<div class="cd-custom-overlay" id="cd-custom-overlay" hidden>
  <div class="cd-custom-card">
    <button type="button" class="cd-custom-close" id="cd-custom-close" aria-label="닫기">&times;</button>
    <h3 class="cd-custom-title">커스텀 마시기</h3>
    <div class="cd-custom-field">
      <label for="cd-custom-name">음료 이름</label>
      <input type="text" id="cd-custom-name" maxlength="100" placeholder="예: 편의점 콜드브루">
    </div>
    <div class="cd-custom-field">
      <label for="cd-custom-mg">카페인 함량 (mg)</label>
      <input type="number" id="cd-custom-mg" min="1" max="1000" step="1" placeholder="예: 150">
    </div>
    <button type="button" class="cd-custom-submit" id="cd-custom-submit">기록하기</button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/feed.js' %}"></script>
{% endblock %}
