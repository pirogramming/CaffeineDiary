{% extends "base.html" %}
{% load static %}

{% block title %}나의 다이어리{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/mydiary.css' %}">
{% endblock %}

{% block content %}
<div class="diary_stage">
    <img src="{% static 'images/grid_bgimg.svg' %}" alt="" class="grid_bgimg">
    <img src="{% static 'images/coffee_bgimg.svg' %}" alt="" class="coffee_bgimg">
    <img src="{% static 'images/pencil_bgimg.svg' %}" alt="" class="pencil_bgimg">

    <div class="diary_cards">
        <img src="{% static 'images/mydiary_card.svg' %}" alt="" class="mydiary_card">
        <div class="card_row">
            <div class="diary_card">
                <img src="{% static 'images/todaycaffeine_card.svg' %}" alt="" class="card_bg">
                <div class="card_title">
                    <h3>오늘의 카페인</h3>
                    <div class="today_caffeine_graph" id="todayCaffeineGraph"></div>
                </div>
            </div>

            <div class="diary_card">
                <img src="{% static 'images/yesleep_card.svg' %}" alt="" class="card_bg">
                <div class="card_title">
                    <h3>어제의 수면</h3>
                    <div class="yesleep_graph" id="yesterdaySleepGraph"></div>
                </div>
            </div>
        </div>

        <div class="diary_card wide">
            <img src="{% static 'images/weeklygraph_card.svg' %}" alt="" class="card_bg">
            <div class="card_title">
                <h3>일주일 그래프</h3>
                <div class="weekly_graph" id="weeklyGraph"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
