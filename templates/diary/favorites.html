{% extends "base.html" %}
{% load static %}

{% block title %}즐겨찾기{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/favorites.css' %}">
{% endblock %}

{% block content %}
<div class="favorites_page" id="favorite-drinks-list">
    <!-- favorites.js가 GET /users/me/drinks/ 결과로 최대 3장을 채운다 -->
</div>

<!-- 수정/추가 버튼 누르면 뜨는 오버레이 -->
<div class="overlay" id="editOverlay" style="display:none;">
    <div class="overlay_content">
        <img src="{% static 'images/favorites_editcard.svg' %}" alt="" class="edit_card">
        <button type="button" class="overlay_close" id="overlay-close-btn" aria-label="닫기">×</button>

        <!-- 1단계: 종류 선택 -->
        <div class="overlay_step" data-step="1">
            <h3>어떤 종류의 음료인가요?</h3>
            <div class="option_list">
                <div class="option_item" data-type="coffee">
                    <img src="{% static 'images/icons/coffee_icon1.svg' %}" alt="">
                    <span>커피</span>
                </div>
                <div class="option_item" data-type="energy">
                    <img src="{% static 'images/icons/energydrink_icon1.svg' %}" alt="">
                    <span>에너지음료</span>
                </div>
                <div class="option_item" data-type="soda">
                    <img src="{% static 'images/icons/cola_icon1.svg' %}" alt="">
                    <span>콜라</span>
                </div>
                <div class="option_item" data-type="tea">
                    <img src="{% static 'images/icons/tea_icon.svg' %}" alt="">
                    <span>차</span>
                </div>
            </div>
            <button type="button" class="next_btn" data-next="brand">다음</button>
        </div>

        <!-- 2단계: 브랜드 선택 (선택한 종류를 취급하는 브랜드만) -->
        <div class="overlay_step overlay_step--list" data-step="2" style="display:none;">
            <h3>어떤 브랜드의 음료인가요?</h3>
            <div class="option_list"></div>
            <button type="button" class="next_btn" data-next="menu">다음</button>
        </div>

        <!-- 3단계: 메뉴(음료명) 선택 -->
        <div class="overlay_step overlay_step--list" data-step="3" style="display:none;">
            <h3>어떤 메뉴인가요?</h3>
            <div class="option_list"></div>
            <button type="button" class="next_btn" data-next="size">다음</button>
        </div>

        <!-- 4단계: 사이즈 선택 -->
        <div class="overlay_step overlay_step--list" data-step="4" style="display:none;">
            <h3>어떤 사이즈로 마시나요?</h3>
            <div class="option_list"></div>
            <button type="button" class="next_btn" data-next="icon">다음</button>
        </div>

        <!-- 5단계: 아이콘 선택 -->
        <div class="overlay_step overlay_step--icons" data-step="5" style="display:none;">
            <h3>아이콘을 선택하세요</h3>
            <div class="option_list"></div>
            <button type="button" class="next_btn" id="wizard-save-btn">완료</button>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/favorites.js' %}"></script>
{% endblock %}
