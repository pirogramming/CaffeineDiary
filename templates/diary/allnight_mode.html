{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밤샘모드</title>
    <link rel="stylesheet" href="{% static 'css/allnight_mode.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="allnight_page">
    <header class="allnight_header">
        <div class="logo">
            <div class="logotext">
                <span>caffeine</span>
                <span>diary</span>
            </div>
        </div>

        <button class="nav_toggle" id="navToggle" aria-expanded="false" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="navMenu">
            <a href="{% url 'diary:feed' %}">메인 화면</a>
            <a href="{% url 'diary:mydiary' %}">나의 다이어리</a>
            <a href="{% url 'diary:favorites' %}">음료 추가</a>
            <a href="{% url 'diary:allnight-setup' %}">밤샘 모드</a>
            <button type="button" id="cd-logout-btn">로그아웃</button>
            <a href="{% url 'diary:mypage' %}">마이페이지</a>
        </nav>

        <div class="nav_backdrop" id="navBackdrop"></div>
    </header>

    <main>
        <div class="allnight_feed">
            <section class="cloud_section">
                <img src="{% static 'images/cloud_section.svg' %}" alt="" class="cloud_background">
                <div class="cloud_content">
                    <p class="timer_text">10:30</p>
                    <button class="finish_btn" id="finishBtn">종료버튼</button>

                    <div class="schedule_toggle collapsed" id="scheduleToggle">
                        <span class="line"></span>
                        <span class="toggle_text">오늘의 스케줄</span>
                        <span class="line"></span>
                    </div>

                    <ul class="schedule_list collapsed" id="scheduleList">
                        <li><span class="time">00:00</span><span class="work">공부 시작</span></li>
                        <li><span class="time">00:00</span><span class="work">카페인 섭취</span></li>
                        <li><span class="time">00:00</span><span class="work">공부 종료</span></li>
                    </ul>
                    <span class="bottom_line"></span>
                </div>
            </section>
        </div>
    </main>
    <script src="{% static 'js/base.js' %}"></script>
    <script src="{% static 'js/allnight_mode.js' %}"></script>
</body>
</html>
